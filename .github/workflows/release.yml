name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: midway-x86_64-unknown-linux-gnu.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: midway-x86_64-pc-windows-msvc.zip
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: midway-aarch64-apple-darwin.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - uses: Swatinem/rust-cache@v2

      - name: Build Midway
        run: cargo build --locked --release --package midway-cli --bin midway --target ${{ matrix.target }}

      - name: Archive Midway
        if: matrix.os != 'windows-latest'
        run: |
          tar -czf "${{ matrix.archive }}" -C "target/${{ matrix.target }}/release" midway

      - name: Archive Midway for Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Compress-Archive -Path "target/${{ matrix.target }}/release/midway.exe" -DestinationPath "${{ matrix.archive }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: midway-${{ matrix.target }}
          path: ${{ matrix.archive }}

  publish:
    name: Publish crates.io packages
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - uses: Swatinem/rust-cache@v2

      - name: Publish workspace crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_PUBLISH }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::Set the CARGO_PUBLISH repository secret to a crates.io publishing token."
            exit 1
          fi

          for package in midway-config midway-logging midway-notifier midway-cli; do
            version=$(cargo metadata --no-deps --format-version 1 | jq -r --arg name "$package" '.packages[] | select(.name == $name) | .version')
            status=$(curl --silent --show-error --location --output /dev/null --write-out "%{http_code}" --user-agent "midway-release-workflow (https://github.com/hazyio/midway)" "https://crates.io/api/v1/crates/$package/$version")

            if [ "$status" = "200" ]; then
              echo "$package $version is already published; skipping."
            elif [ "$status" = "404" ]; then
              cargo publish --locked --package "$package"
            else
              echo "::error::Could not check crates.io for $package $version (HTTP $status)."
              exit 1
            fi
          done

  release:
    name: Create GitHub Release
    needs: [build, publish]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from Cargo.toml
        id: version
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "midway-cli") | .version')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          make_latest: true
          generate_release_notes: true
          files: artifacts/*
