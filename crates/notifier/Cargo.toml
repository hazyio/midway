[package]
name = "midway-notifier"
version = "0.1.0"
edition = "2024"
authors = ["HazyIo"]
description = "Notification delivery for Midway."
license = "MIT"
repository = "https://github.com/hazyio/midway"
homepage = "https://midway.hazyio.com"
documentation = "https://midway.hazyio.com/notifications/local"

[dependencies]
rand = "0.10.3"
tracing = "0.1.44"
serde = "1.0.229"
notify-rust = "4.18.2"
lettre = "0.11.23"
ureq = { version = "3.4.2", features = ["json"] }

config = { package = "midway-config", path = "../config", version = "0.1.0" }
serde_json = "1.0.154"

[lints]
workspace = true
